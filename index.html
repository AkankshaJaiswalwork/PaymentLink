<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayLink - Demo Interface</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f3f4f6; color: #1f2937; }
        h1 { text-align: center; color: #111827; }
        .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); margin-bottom: 24px; }
        input, button { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; border-radius: 6px; border: 1px solid #d1d5db; font-size: 16px; }
        button { background: #6366f1; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #4f46e5; }
        button.secondary { background: #10b981; }
        button.secondary:hover { background: #059669; }
        #linkResult { background: #ecfdf5; border: 1px solid #10b981; padding: 16px; margin-top: 16px; border-radius: 6px; display: none; word-break: break-all; }
        a { color: #6366f1; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🔗 PayLink Demo</h1>
    
    <div class="card" id="authSection">
        <h2>1. Merchant Login</h2>
        <p style="font-size: 14px; color: #6b7280;">Sign up to create a test merchant account, then log in to generate links.</p>
        <input type="email" id="email" placeholder="merchant@example.com">
        <input type="password" id="password" placeholder="Password (min 6 chars)">
        <button class="secondary" onclick="signup()">Sign Up</button>
        <button onclick="login()">Log In</button>
        <p id="authMsg" style="color: #10b981; font-weight: bold; text-align: center;"></p>
    </div>

    <div class="card" id="linkSection" style="display: none;">
        <h2>2. Create a Payment Link</h2>
        <input type="number" id="amount" placeholder="Amount in cents (e.g. 5000 = $50.00)">
        <input type="text" id="currency" placeholder="currency (e.g. usd)" value="usd">
        <input type="text" id="desc" placeholder="Product Description">
        <button onclick="createLink()">Generate Short Link</button>
        
        <div id="linkResult"></div>
    </div>

    <script>
        let jwtToken = '';

        async function signup() {
            const res = await fetch('/signup', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
            });
            if(res.ok) { document.getElementById('authMsg').innerText = "Account created! You can now log in."; }
            else { const err = await res.json(); alert("Error: " + JSON.stringify(err.errors || err.error)); }
        }

        async function login() {
            const res = await fetch('/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
            });
            if(res.ok) { 
                const data = await res.json();
                jwtToken = data.token;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('linkSection').style.display = 'block';
            } else { alert("Login failed. Check credentials."); }
        }

        async function createLink() {
            const res = await fetch('/links', {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${jwtToken}` },
                body: JSON.stringify({ 
                    amount: parseInt(document.getElementById('amount').value), 
                    currency: document.getElementById('currency').value, 
                    description: document.getElementById('desc').value 
                })
            });
            const data = await res.json();
            if(res.ok) {
                const el = document.getElementById('linkResult');
                el.style.display = 'block';
                el.innerHTML = `<strong>Success!</strong> Anyone with this link will be taken to Stripe Checkout:<br><br><a href="${data.url}" target="_blank">${data.url}</a>`;
            } else { alert("Error: " + JSON.stringify(data.errors || data.error)); }
        }
    </script>
</body>
</html>
